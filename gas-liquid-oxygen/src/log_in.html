<!DOCTYPE html>
<html>

<head>
    <title>Login - Hospital Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="logo">
                <img
                    src="logo bme.png"
                    alt="logo bme"
                    style="width:130px;height:130px"
                >
            </div>



        </aside>


        <!-- MAIN CONTENT -->
        <main class="main">

            <!-- HEADER -->
            <header class="hero">

                <div class="hero-title">
                    <h1 style="text-align: center;">Log In</h1>
                </div>

            </header>


            <!-- LOGIN SECTION -->
            <section class="section login-section">

                <div class="login-card">

                    <h2>Hospital Dashboard</h2>

                    <p class="login-subtitle">
                        Please log in to continue
                    </p>


                    <!-- USERNAME -->
                    <div class="login-input-group">

                        <label for="username">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            placeholder="Enter username"
                            autocomplete="username"
                        >

                    </div>


                    <!-- PASSWORD -->
                    <div class="login-input-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter password"
                            autocomplete="current-password"
                        >

                    </div>


                    <!-- LOGIN BUTTON -->
                    <button
                        id="login-button"
                        class="login-button"
                        type="button"
                    >
                        Log In
                    </button>

                    <!-- GUEST LOGIN -->

                    <p class="guest-login">
                        <a href="#" id="guest-login">
                            Log in as Guest
                        </a>
                    </p>
                    
                    <!-- ERROR MESSAGE -->
                    <p
                        id="login-message"
                        class="login-message"
                    ></p>

                </div>

            </section>

        </main>

    </div>


    <script src="log_in.js"></script>
    <script src="auth.js"></script>
</body>

</html>
