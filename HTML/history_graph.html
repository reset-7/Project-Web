<!DOCTYPE html>
<html>
<!-- >side preview -->
<head>
    <title>History Graph</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="history_graph.js"></script>
</head>

<body>

    <!-- Main Page -->
    <div class="page">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="logo">
                <img src="logo bme.png" alt="logo bme" style="width:130px;height:130px">
            </div>

            <nav>
                <a href="dashboard.html">Dashboard</a>
                <a href="history_graph.html">History Graph </a>
                <a href="data_management.html">Data Management</a>
                <a href="setting.html">Setting</a>
                <a href="help.html">Help</a>
                <div id="user-nav"></div>
            </nav>

        </aside>


        <!-- MAIN CONTENT -->
        <main class="main">

            <!-- HERO / HEADER -->
            <header class="hero">

                <div class="hero-title">
                    <h1>History Graph : Gas & Liquid Oxygen Tank </h1>
                </div>

                <div class="last-updated">
                    Last updated : <span id="last-updated">-</span>
                </div>

            </header>


            <!-- SECTION 1 -->
            <section class="section">

                <h2>Filter</h2>

                    <div class="filter_card filter_card_bg">

                        <button onclick="setHistoryFilter('7')">
                            Last 7 Days
                        </button>

                        <button onclick="setHistoryFilter('30')">
                            Last 30 Days
                        </button>

                        <button onclick="setHistoryFilter('all')">
                            All Data
                        </button>

                        <label>
                            Start:
                            <input
                                type="date"
                                id="history-start-date">
                        </label>

                        <label>
                            End:
                            <input
                                type="date"
                                id="history-end-date">
                        </label>

                        <button onclick="applySpecificDateFilter()">
                            Apply
                        </button>

                    </div>


            </section>


            <!-- SECTION 2 -->
            <section class="section">

                <h2>Graph : Gas Oxygen Tank</h2>

                <div class="card history-chart-card">

                    <h3>Gas Tank Availability</h3>

                    <div class="chart-container">
                        <canvas id="gas-history-chart"></canvas>
                    </div>

                </div>

            </section>


            <!-- SECTION 3 -->
            <section class="section">

                <h2>Graph : Liquid Oxygen Tank</h2>

                <div class="card history-chart-card">

                    <h3>Liquid Oxygen Level</h3>

                    <div class="chart-container">
                        <canvas id="oxygen-history-chart"></canvas>
                    </div>

                </div>

            </section>

        </main>

    </div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script src="history_graph.js"></script>
<!--<script src="auth.js"></script>-->
</body>
</html>
